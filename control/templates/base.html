<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sage control</title>
  <style>
    :root { --bg:#f6f7f9; --card:#fff; --text:#1d2330; --muted:#667085; --line:#e4e7ec; --accent:#2b6cb0; --danger:#c53030; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#12151c; --card:#1b1f2a; --text:#e6e8ee; --muted:#9aa3b2; --line:#2a3040; --accent:#63a4ff; --danger:#ff7b7b; }
    }
    body { margin:0; font:15px/1.5 system-ui, sans-serif; background:var(--bg); color:var(--text); }
    header { display:flex; align-items:center; justify-content:space-between; padding:12px 20px; background:var(--card); border-bottom:1px solid var(--line); flex-wrap:wrap; gap:8px; }
    nav a { margin-right:14px; color:var(--accent); text-decoration:none; }
    nav a.active { font-weight:600; }
    main { max-width:920px; margin:24px auto; padding:0 16px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:18px; margin-bottom:18px; }
    h1 { font-size:20px; margin:0 0 12px; }
    h2 { font-size:16px; margin:0 0 10px; }
    table { width:100%; border-collapse:collapse; }
    th, td { text-align:left; padding:8px; border-bottom:1px solid var(--line); vertical-align:top; word-break:break-word; }
    th { color:var(--muted); font-weight:500; }
    label { display:block; font-weight:500; margin:10px 0 4px; }
    input, textarea { width:100%; box-sizing:border-box; padding:9px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--text); font:inherit; }
    textarea { min-height:90px; }
    .hint { color:var(--muted); font-size:13px; margin-top:4px; }
    button { padding:9px 14px; border:0; border-radius:8px; background:var(--accent); color:#fff; font:inherit; cursor:pointer; }
    button.danger { background:var(--danger); }
    button.link { background:none; color:var(--accent); padding:0; }
    .notice { padding:10px 12px; border-radius:8px; margin-bottom:14px; background:var(--bg); border:1px solid var(--line); }
    .error { border-color:var(--danger); color:var(--danger); }
    .row { display:flex; gap:12px; flex-wrap:wrap; }
    .row > * { flex:1 1 200px; }
    form.inline { display:inline; }
    @media (max-width:600px) { th, td { font-size:13px; } }
  </style>
</head>
<body>
  {% if user %}
  <header>
    <strong>Sage control</strong>
    <nav>
      <a href="/" class="{% if request.url.path == '/' %}active{% endif %}">Overview</a>
      <a href="/trunks" class="{% if request.url.path == '/trunks' %}active{% endif %}">Trunks</a>
      <a href="/rules" class="{% if request.url.path == '/rules' %}active{% endif %}">Dispatch rules</a>
      <a href="/settings" class="{% if request.url.path == '/settings' %}active{% endif %}">Agent settings</a>
    </nav>
    <form method="post" action="/logout" class="inline"><button class="link" type="submit">Log out</button></form>
  </header>
  {% endif %}
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
