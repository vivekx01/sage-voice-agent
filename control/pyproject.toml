[project]
name = "sage-control"
version = "0.1.0"
description = "Web UI for managing the Sage voice agent"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "itsdangerous>=2.2",
    "python-multipart>=0.0.9",
    "livekit-api>=1.0",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
]
