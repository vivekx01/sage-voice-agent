{% extends "base.html" %}
{% block content %}
<h1>Edit dispatch rule</h1>
{% if error %}<div class="notice error">Could not load trunks: {{ error }}</div>{% endif %}

<div class="card">
  <form method="post" action="/rules/{{ rule.id }}/edit">
    <div class="row">
      <div>
        <label for="name">Name</label>
        <input id="name" name="name" value="{{ rule.name }}" required>
      </div>
      <div>
        <label for="room_prefix">Room prefix</label>
        <input id="room_prefix" name="room_prefix" value="{{ rule.prefix or 'call-' }}" required>
      </div>
    </div>

    <label>Trunks this rule applies to</label>
    {% for t in trunks %}
    <label style="font-weight:400;display:flex;gap:8px;align-items:center;margin:6px 0;">
      <input type="checkbox" name="trunk_ids" value="{{ t.id }}" style="width:auto;"
             {% if t.id in rule.trunk_ids %}checked{% endif %}>
      {{ t.name }} ({{ t.numbers | join(", ") }})
    </label>
    {% else %}
    <p class="hint">No trunks yet.</p>
    {% endfor %}
    <div class="hint">Leave all unchecked to apply this rule to every trunk.</div>

    <p><button type="submit">Save rule</button> <a href="/rules">Cancel</a></p>
  </form>
</div>
{% endblock %}
